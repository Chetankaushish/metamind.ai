groups:
  - name: metamind_alerts
    rules:
      - alert: DatabaseDown
        expr: db_connection_pool_active == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL Database Connection Pool Empty or Down"

      - alert: RedisDown
        expr: redis_memory_used_bytes == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis Cache or Celery Broker Unreachable"

      - alert: QueueOverflow
        expr: celery_queue_length > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Celery Queue backlog exceeds 1000 tasks"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate detected on Backend API"
