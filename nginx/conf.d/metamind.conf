upstream frontend_upstream {
    least_conn;
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream backend_upstream {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name adsmind.online www.adsmind.online;

    # Certbot Challenge Route
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check route
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Redirect all HTTP traffic to HTTPS (if SSL enabled)
    location / {
        return 301 https://$host$request_uri;
    }
}

#server {
    #listen 443 ssl http2;
    #listen [::]:443 ssl http2;
    #server_name _;

    # SSL Certificates (Let's Encrypt path or dummy fallback)
    #ssl_certificate /etc/letsencrypt/live/adsmind.online/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/adsmind.online/privkey.pem;

    #ssl_protocols TLSv1.2 TLSv1.3;
    #ssl_ciphers HIGH:!aNULL:!MD5;
    #ssl_prefer_server_ciphers on;
    #ssl_session_cache shared:SSL:10m;
    #ssl_session_timeout 10m;

    # Client upload size limit for Meta Video/Image ad uploads
    client_max_body_size 100M;

    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Vite Static Assets Caching
    location /assets/ {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    expires 365d;

    add_header Cache-Control "public, immutable";
    }

    # WebSocket Server Connection
    location /ws {
        proxy_pass http://backend_upstream/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # FastAPI Backend API Endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Meta Graph Webhook Receiver Endpoint
    location /api/webhooks/meta {
        proxy_pass http://backend_upstream/webhooks/meta;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Reverse Proxy
    location / {
    proxy_pass http://frontend_upstream;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    }
}
