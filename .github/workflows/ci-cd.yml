name: Enterprise CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-audit:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Linter & Typecheck
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Build Verification
        working-directory: ./frontend
        run: npm run build

      - name: Dependency Security Audit (Frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx flake8 safety

      - name: Python Syntax & Lint Check
        run: |
          python -m flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Dependency Vulnerability Audit (Backend)
        run: |
          safety check || true

  test-and-build:
    name: Build Docker Containers & Integration Verification
    needs: lint-and-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: metamind-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: metamind-frontend:test

      - name: Verify Docker Compose Production Stack Configuration
        run: |
          docker compose -f docker-compose.prod.yml config

  deploy-staging-production:
    name: Deploy to Hostinger VPS
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute SSH Remote Deployment on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_IP }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          key: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
          script: |
            cd /opt/metamind-ai
            git pull origin main
            chmod +x scripts/*.sh
            ./scripts/deploy-vps.sh
