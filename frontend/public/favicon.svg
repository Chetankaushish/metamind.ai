<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C4CF1" />
      <stop offset="40%" stop-color="#5B5CEB" />
      <stop offset="75%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="innerBg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#6C4CF1" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Glass Frame -->
  <rect x="3" y="3" width="58" height="58" rx="18" fill="url(#innerBg)" stroke="url(#brandGrad)" stroke-width="3" />

  <!-- Background Glowing Accent Ring -->
  <rect x="6" y="6" width="52" height="52" rx="15" fill="none" stroke="url(#brandGrad)" stroke-width="1" stroke-opacity="0.3" />

  <!-- Upward AI Growth Curve & Analytics Line -->
  <path d="M16 43 L26 31 L35 36 L48 19" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Growth Arrowhead -->
  <path d="M40 19 H48 V27" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Neural Spark / Star at Peak -->
  <path d="M48 19 C48 15 44 15 44 15 C44 15 48 15 48 11 C48 15 52 15 52 15 C52 15 48 15 48 19 Z" fill="#FFFFFF" />

  <!-- AI Analytics Nodes -->
  <circle cx="16" cy="43" r="4" fill="#6C4CF1" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="26" cy="31" r="3.5" fill="#5B5CEB" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="35" cy="36" r="3.5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2" />

  <!-- Subtle Automation Flow Loop -->
  <path d="M26 31 C29 23, 38 23, 41 19" stroke="#A78BFA" stroke-width="2" stroke-dasharray="2 3" opacity="0.8" />
</svg>
